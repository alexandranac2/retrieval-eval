[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-eval"
version = "0.1.0"
description = "Small, honest retrieval evaluation: recall@k, MRR, nDCG, latency, ablations and a regression gate for RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandra Nac" }]
dependencies = []
keywords = ["rag", "retrieval", "evaluation", "information-retrieval", "llm"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
retrieval-eval = "retrieval_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrieval_eval = ["ui/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
