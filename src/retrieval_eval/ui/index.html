<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>retrieval-eval</title>
<!--STATIC_RUN-->
<style>
:root {
  --paper: #eef1f4;
  --sheet: #f8fafb;
  --ink: #14212b;
  --ink-2: #4a5864;
  --ink-3: #7b8894;
  --rule: #c9d1d9;
  --rule-soft: #dde3e8;
  --act: #4b3bc4;
  --act-ink: #ffffff;
  --r1: #0f766e;
  --r2: #4f9a92;
  --r3: #8dbdb6;
  --r4: #b9d3cf;
  --r5: #d3e2df;
  --miss: #b42318;
  --miss-soft: #f6dcd8;
  --up: #0f766e;
  --down: #b42318;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #10161c;
    --sheet: #161e26;
    --ink: #e3e9ee;
    --ink-2: #a8b4be;
    --ink-3: #74828e;
    --rule: #2c3844;
    --rule-soft: #212b35;
    --act: #8f84ff;
    --act-ink: #10161c;
    --r1: #3fc1b0;
    --r2: #2f9488;
    --r3: #25665f;
    --r4: #1f4a46;
    --r5: #1b3835;
    --miss: #ff7a66;
    --miss-soft: #3a1d1a;
    --up: #3fc1b0;
    --down: #ff7a66;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
[hidden] { display: none !important; }

/* --- frame ------------------------------------------------------------- */
.bar {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 1px solid var(--rule); background: var(--sheet);
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.bar .meta { color: var(--ink-2); font-size: 13px; }
.bar .meta b { color: var(--ink); font-weight: 600; }
.bar .spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.layout.static { grid-template-columns: minmax(0, 1fr); }
aside { border-right: 1px solid var(--rule); background: var(--sheet); }
.rail-inner { position: sticky; top: 0; max-height: 100vh; overflow: auto; padding: 18px 0; }
aside h2, .section-title { font-size: 13px; font-weight: 650; margin: 0 20px 10px; color: var(--ink); }
main { padding: 22px 28px 60px; min-width: 0; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--rule); }
  .rail-inner { position: static; max-height: 40vh; }
  main { padding: 18px 16px 48px; }
  .bar { padding: 12px 16px; }
}

/* --- buttons ------------------------------------------------------------ */
.btn {
  display: inline-block; text-decoration: none;
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 550;
}
a.btn { color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--act); color: var(--act-ink); border-color: var(--act); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); padding: 4px 8px; }
.btn.quiet:hover { color: var(--ink); background: var(--rule-soft); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* --- run history -------------------------------------------------------- */
.runs { list-style: none; margin: 0; padding: 0; }
.runs li button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 9px 20px; border-left: 3px solid transparent;
}
.runs li button:hover { background: var(--rule-soft); }
.runs li button[aria-current="true"] { border-left-color: var(--act); background: var(--rule-soft); }
.runs .label, .runs .when, .runs .best { display: block; }
.runs .when { font-size: 12px; color: var(--ink-3); }
.runs .label { font-weight: 600; font-size: 13px; }
.runs .best { font-size: 12px; color: var(--ink-2); }
.new-run { margin: 0 20px 16px; width: calc(100% - 40px); }
.empty-rail { padding: 0 20px; color: var(--ink-3); font-size: 13px; }

/* --- tabs ---------------------------------------------------------------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 22px; }
.tabs button {
  border: 0; background: none; padding: 8px 14px; cursor: pointer; color: var(--ink-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* --- composer ------------------------------------------------------------ */
.composer { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 18px 20px; margin-bottom: 26px; }
.composer h2 { font-size: 16px; margin: 0 0 4px; }
.composer p.hint { margin: 0 0 14px; color: var(--ink-2); font-size: 13px; max-width: 70ch; }
.target-pick { display: grid; gap: 6px; margin-bottom: 14px; }
.target-pick label { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
.target-pick .spec { color: var(--ink-3); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.composer-row { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field input { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 6px 9px; font-size: 13px; color: var(--ink); min-width: 0; }
.progress { margin-top: 12px; color: var(--ink-2); font-size: 13px; }
.error { margin-top: 12px; color: var(--miss); background: var(--miss-soft); border-radius: 6px; padding: 8px 12px; font-size: 13px; }

/* --- scoreboard ---------------------------------------------------------- */
.run-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.run-head h1 { font-size: 20px; margin: 0; letter-spacing: -0.015em; }
.run-head .sub { color: var(--ink-2); font-size: 13px; }
.score-wrap { overflow-x: auto; margin-bottom: 34px; }
table.score { border-collapse: collapse; width: 100%; min-width: 620px; }
table.score th, table.score td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
table.score th { font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom-color: var(--rule); }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score td.cfg { font-weight: 650; white-space: nowrap; }
table.score .best .v { font-weight: 700; }
table.score .best .v::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--r1); margin-left: 6px; vertical-align: 2px; }
.delta { display: block; font-size: 11px; color: var(--ink-3); }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.mrrbar { display: block; height: 3px; background: var(--rule-soft); margin-top: 5px; border-radius: 2px; }
.mrrbar i { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
.base-tag { font-size: 11px; font-weight: 600; color: var(--act); }
.cfg-line { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
table.score .v { white-space: nowrap; }
table.score th { white-space: nowrap; }
.cfg-actions .btn { font-size: 12px; padding: 1px 6px; opacity: 0; }
table.score tr:hover .cfg-actions .btn, .cfg-actions .btn:focus-visible { opacity: 1; }
@media (hover: none) { .cfg-actions .btn { opacity: 1; } }

/* --- rank grid (the signature) ------------------------------------------ */
.grid-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.grid-head h2 { font-size: 16px; margin: 0; }
.grid-head .count { color: var(--ink-2); font-size: 13px; }
.filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-left: auto; font-size: 13px; }
.filters input[type="search"], .filters select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 9px; font-size: 13px; }
.legend { display: flex; gap: 14px; align-items: center; color: var(--ink-3); font-size: 12px; margin: 0 0 10px; flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.rank-grid { border-top: 1px solid var(--rule); }
.rg-row {
  display: grid; grid-template-columns: minmax(220px, 1fr) repeat(var(--cols), minmax(92px, 118px));
  align-items: center; border-bottom: 1px solid var(--rule-soft);
}
.rg-row.header { font-size: 12px; font-weight: 600; color: var(--ink-2); border-bottom-color: var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 1; }
.rg-row.header > div { padding: 8px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.rg-row { width: 100%; border: 0; border-bottom: 1px solid var(--rule-soft); background: transparent; text-align: left; cursor: pointer; padding: 0; }
button.rg-row:hover { background: var(--sheet); }
button.rg-row[aria-expanded="true"] { background: var(--sheet); }
.rg-q { padding: 9px 10px; min-width: 0; }
.rg-q .text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rg-q .tags { font-size: 11px; color: var(--ink-3); }
.rg-cell { padding: 9px 10px; display: flex; align-items: center; gap: 8px; }
.ladder { display: inline-grid; grid-auto-flow: column; gap: 2px; }
.ladder i { display: block; width: 9px; height: 16px; border-radius: 2px; background: var(--rule-soft); }
.ladder i.on { background: var(--c); }
.ladder.miss i { background: transparent; box-shadow: inset 0 0 0 1px var(--miss); opacity: 0.55; }
.rank-n { font-family: var(--mono); font-size: 12px; color: var(--ink-2); min-width: 2ch; }
.rank-n.miss { color: var(--miss); font-weight: 600; }
.rg-empty { padding: 26px 10px; color: var(--ink-2); }
@media (max-width: 640px) {
  .rg-row { grid-template-columns: minmax(150px, 1fr) repeat(var(--cols), 64px); }
  .ladder i { width: 6px; }
  .rank-n { display: none; }
}

/* --- query detail -------------------------------------------------------- */
.detail { background: var(--sheet); border-bottom: 1px solid var(--rule); padding: 14px 16px 18px; }
.detail .q { font-weight: 650; margin-bottom: 4px; }
.detail .want { font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
.detail-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.detail-cols h3 { font-size: 13px; margin: 0 0 6px; }
.detail-cols h3 .num { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 6px; }
.detail-cols ol { margin: 0; padding-left: 22px; font-size: 12px; }
.detail-cols li { padding: 2px 0; color: var(--ink-2); }
.detail-cols li .num { font-size: 12px; }
.detail-cols li .t { color: var(--ink-3); }
.detail-cols li.hit .t { color: inherit; }
.detail-cols li.hit { color: var(--r1); font-weight: 700; }
.detail-cols .none { font-size: 12px; color: var(--miss); }

/* --- cases + targets editors -------------------------------------------- */
.editor-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.editor-head h2 { font-size: 16px; margin: 0; }
.editor-head .hint { color: var(--ink-2); font-size: 13px; max-width: 70ch; }
.editor-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.dirty { font-size: 12px; color: var(--ink-3); }
table.edit { border-collapse: collapse; width: 100%; }
table.edit th { font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
table.edit td { padding: 4px 6px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
table.edit input { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 6px 8px; }
table.edit input:hover { border-color: var(--rule-soft); }
table.edit input:focus { border-color: var(--act); background: var(--sheet); outline: none; }
table.edit td.ids input, table.edit td.spec input { font-family: var(--mono); font-size: 12px; }
table.edit td.idx { color: var(--ink-3); font-family: var(--mono); font-size: 12px; width: 3ch; text-align: right; }
table.edit td.del { width: 1%; }
.help { margin-top: 18px; color: var(--ink-2); font-size: 13px; max-width: 72ch; }
.help code { font-family: var(--mono); font-size: 12px; background: var(--rule-soft); padding: 1px 5px; border-radius: 4px; }
.welcome { max-width: 62ch; padding: 30px 0; }
.welcome h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.015em; }
.welcome p { color: var(--ink-2); }

@media (prefers-reduced-motion: no-preference) {
  .detail { animation: open 160ms ease-out; }
  @keyframes open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<header class="bar">
  <span class="brand">retrieval-eval</span>
  <span class="meta" id="bar-meta"></span>
  <span class="spacer"></span>
  <span class="meta" id="bar-baseline"></span>
</header>
<div class="layout" id="layout">
  <aside id="rail" aria-label="Run history"></aside>
  <main id="main"></main>
</div>

<script>
"use strict";
const STATIC = window.__STATIC__ || null;
const S = {
  state: null,          // server state (live mode)
  run: null,            // run being viewed
  baselineRun: null,    // run holding the baseline config
  tab: "results",
  composing: false,
  running: false,
  error: "",
  open: null,           // index of expanded query
  onlyDiff: true,
  search: "",
  tag: "",
  casesDraft: null,
  targetsDraft: null,
};

// ---------------------------------------------------------------- helpers
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pct = (v) => `${Math.round(v * 100)}%`;
const f3 = (v) => v.toFixed(3);
const ms = (v) => (v >= 100 ? v.toFixed(0) : v.toFixed(1));
const when = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const parseId = (s) => (/^-?\d+$/.test(s) ? Number(s) : s);
const sameId = (a, b) => String(a) === String(b);

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

// Metric columns come from the run itself, so any k works.
function columns(run) {
  const first = run.reports[0];
  const ks = Object.keys(first.recall);
  const lastK = Object.keys(first.ndcg).slice(-1)[0];
  return [
    ...ks.map((k) => ({ key: `recall${k}`, label: `Recall${k}`, get: (r) => r.recall[k], fmt: pct, higher: true })),
    { key: "mrr", label: "MRR", get: (r) => r.mrr, fmt: f3, higher: true, bar: true },
    { key: `ndcg${lastK}`, label: `nDCG${lastK}`, get: (r) => r.ndcg[lastK], fmt: f3, higher: true },
    { key: "p50", label: "p50 ms", get: (r) => r.latency_ms.p50, fmt: ms, higher: false },
    { key: "p95", label: "p95 ms", get: (r) => r.latency_ms.p95, fmt: ms, higher: false },
  ];
}

function baselineReport() {
  const b = S.state && S.state.baseline;
  if (!b || !S.baselineRun || S.baselineRun.id !== b.run) return null;
  return S.baselineRun.reports.find((r) => r.name === b.config) || null;
}

// ---------------------------------------------------------------- rendering
function renderBar() {
  if (STATIC) {
    const run = STATIC.run;
    $("#bar-meta").innerHTML = `Report for <b>${esc(run.label || when(run.created_at))}</b>, ${run.reports[0].n} questions${STATIC.cases_path ? ` from <b>${esc(STATIC.cases_path)}</b>` : ""}`;
    $("#bar-baseline").textContent = "";
    return;
  }
  const st = S.state;
  $("#bar-meta").innerHTML = `<b>${esc(st.cases_path)}</b>, ${st.cases.length} labeled question${st.cases.length === 1 ? "" : "s"}`;
  const b = st.baseline;
  $("#bar-baseline").innerHTML = b ? `Baseline: <b>${esc(b.config)}</b> from ${esc(runName(b.run))}` : "No baseline set";
}

function runName(id) {
  const r = S.state && S.state.runs.find((x) => x.id === id);
  return r ? r.label || when(r.created_at) : id;
}

function renderRail() {
  const rail = $("#rail");
  if (STATIC) { rail.hidden = true; $("#layout").classList.add("static"); return; }
  const runs = S.state.runs;
  rail.innerHTML = `<div class="rail-inner">
    <button class="btn primary new-run" data-act="compose">New run</button>
    <h2>Runs</h2>
    ${runs.length ? `<ul class="runs">${runs.map((r) => {
      const best = r.configs.reduce((a, c) => (c.mrr > a.mrr ? c : a), r.configs[0]);
      return `<li><button data-run="${esc(r.id)}" aria-current="${S.run && S.run.id === r.id}">
        <span class="label">${esc(r.label || r.configs.map((c) => c.name).join(" vs "))}</span>
        <span class="when">${esc(when(r.created_at))}</span>
        <span class="best">${best ? `Best MRR <span class="num">${f3(best.mrr)}</span>, ${esc(best.name)}` : ""}</span>
      </button></li>`;
    }).join("")}</ul>` : `<p class="empty-rail">Runs you make appear here, newest first.</p>`}
  </div>`;
}

function renderMain() {
  const main = $("#main");
  if (STATIC) { main.innerHTML = results(STATIC.run); return; }
  const tabs = [["results", "Results"], ["cases", `Questions (${S.state.cases.length})`], ["targets", `Targets (${S.state.targets.length})`]];
  main.innerHTML = `
    ${S.composing || !S.state.runs.length ? composer() : ""}
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${esc(l)}</button>`).join("")}</div>
    <section>${S.tab === "results" ? (S.run ? results(S.run) : noRun()) : S.tab === "cases" ? casesEditor() : targetsEditor()}</section>
  `;
}

function noRun() {
  if (!S.state.cases.length) {
    return `<div class="welcome"><h1>Start by labeling a few questions</h1>
      <p>For each question a user might ask, write down the id of the item that correctly answers it. Ten honest labels beat a hundred guessed ones.</p>
      <button class="btn primary" data-tab="cases">Add questions</button></div>`;
  }
  if (!S.state.runs.length) {
    return `<div class="welcome"><h1>No runs yet</h1><p>Pick the targets to compare above and run them. Results show how often each one puts the right answer first, and exactly which questions they disagree on.</p></div>`;
  }
  return `<div class="welcome"><h1>No run selected</h1><p>Pick a run on the left, or start a new one above.</p></div>`;
}

function composer() {
  const st = S.state;
  const n = st.cases.length;
  const picked = new Set((S.pick || st.targets.map((t) => t.name)));
  return `<div class="composer">
    <h2>New run</h2>
    <p class="hint">Every question goes through each selected target twice: once to warm caches, then once timed and scored.</p>
    ${st.targets.length ? `<div class="target-pick">${st.targets.map((t) => `
      <label><input type="checkbox" name="pick" value="${esc(t.name)}" ${picked.has(t.name) ? "checked" : ""}>
      <span><b>${esc(t.name)}</b> <span class="spec">${esc(t.spec)}</span></span></label>`).join("")}</div>`
      : `<p class="hint">No targets yet. <button class="btn quiet" data-tab="targets">Add a target</button></p>`}
    <div class="composer-row">
      <label class="field">Name this run (optional)<input id="run-label" placeholder="e.g. after chunking change" value="${esc(S.runLabel || "")}"></label>
      <label class="field">Cut-offs (k)<input id="run-ks" class="num" value="${esc(st.default_ks.join(", "))}" size="9"></label>
      <button class="btn primary" data-act="run" ${S.running || !st.targets.length || !n ? "disabled" : ""}>${S.running ? "Running" : `Run on ${n} question${n === 1 ? "" : "s"}`}</button>
      ${st.runs.length ? `<button class="btn quiet" data-act="cancel-compose">Cancel</button>` : ""}
    </div>
    ${S.running ? `<p class="progress">Running. Slow targets (a model reranker, a remote API) can take a minute.</p>` : ""}
    ${S.error ? `<p class="error" role="alert">${esc(S.error)}</p>` : ""}
  </div>`;
}

function results(run) {
  const cols = columns(run);
  const base = STATIC ? null : baselineReport();
  const best = {};
  for (const c of cols) {
    const vals = run.reports.map(c.get);
    best[c.key] = c.higher ? Math.max(...vals) : Math.min(...vals);
  }
  const multi = run.reports.length > 1;
  const b = S.state && S.state.baseline;
  const rows = run.reports.map((r) => {
    const isBase = b && b.run === run.id && b.config === r.name;
    return `<tr>
      <td class="cfg"><span class="cfg-line"><span>${esc(r.name)}</span>${isBase ? `<span class="base-tag">baseline</span>` : ""}
        ${STATIC || isBase ? "" : `<span class="cfg-actions"><button class="btn quiet" data-base="${esc(r.name)}" aria-label="Set ${esc(r.name)} as baseline">Set as baseline</button></span>`}</span></td>
      ${cols.map((c) => {
        const v = c.get(r);
        const isBest = multi && v === best[c.key];
        let delta = "";
        if (base && !isBase) {
          const d = v - c.get(base);
          const good = c.higher ? d > 0 : d < 0;
          const tiny = Math.abs(d) < (c.fmt === ms ? 0.5 : 0.0005);
          delta = `<span class="delta ${tiny ? "" : good ? "up" : "down"}">${tiny ? "same" : `${d > 0 ? "+" : "−"}${c.fmt(Math.abs(d))}`}</span>`;
        }
        const bar = c.bar ? `<span class="mrrbar" aria-hidden="true"><i style="width:${Math.max(0, Math.min(1, v)) * 100}%"></i></span>` : "";
        return `<td class="num ${isBest ? "best" : ""}"><span class="v">${c.fmt(v)}</span>${delta}${bar}</td>`;
      }).join("")}
    </tr>`;
  }).join("");

  const actions = STATIC ? "" : `<a class="btn" href="/export/${encodeURIComponent(run.id)}">Download report</a>
    <button class="btn quiet" data-act="delete">Delete run</button>`;
  return `
    <div class="run-head">
      <h1>${esc(run.label || run.reports.map((r) => r.name).join(" vs "))}</h1>
      <span class="sub">${esc(when(run.created_at))}, ${run.reports[0].n} questions${base ? `, compared with baseline ${esc(b.config)}` : ""}</span>
      <span class="spacer" style="flex:1"></span>${actions}
    </div>
    <div class="score-wrap"><table class="score">
      <thead><tr><th>Configuration</th>${cols.map((c) => `<th>${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${rankGrid(run)}`;
}

function rankGrid(run) {
  const reps = run.reports;
  const n = reps[0].cases.length;
  const maxK = Math.max(...(run.ks || [5]), 5);
  const tags = [...new Set(reps[0].cases.flatMap((c) => c.tags || []))].sort();
  const multi = reps.length > 1;
  let shown = [];
  for (let i = 0; i < n; i++) {
    const c = reps[0].cases[i];
    const ranks = reps.map((r) => r.cases[i].rank);
    const disagree = new Set(ranks.map(String)).size > 1;
    if (multi && S.onlyDiff && !disagree) continue;
    if (S.search && !c.q.toLowerCase().includes(S.search.toLowerCase())) continue;
    if (S.tag && !(c.tags || []).includes(S.tag)) continue;
    shown.push(i);
  }
  const header = `<div class="rg-row header" style="--cols:${reps.length}"><div>Question</div>${reps.map((r) => `<div title="${esc(r.name)}">${esc(r.name)}</div>`).join("")}</div>`;
  const body = shown.length ? shown.map((i) => {
    const c = reps[0].cases[i];
    const open = S.open === i;
    return `<button class="rg-row" style="--cols:${reps.length}" data-q="${i}" aria-expanded="${open}">
      <span class="rg-q"><span class="text">${esc(c.q)}</span>${c.tags && c.tags.length ? `<span class="tags">${esc(c.tags.join(", "))}</span>` : ""}</span>
      ${reps.map((r) => cell(r.cases[i].rank, maxK)).join("")}
    </button>${open ? detail(run, i) : ""}`;
  }).join("") : `<div class="rg-empty">${multi && S.onlyDiff ? "Every configuration ranks every question the same way. Turn off the filter to see them all." : "No questions match these filters."}</div>`;

  const diffCount = multi ? reps[0].cases.filter((_, i) => new Set(reps.map((r) => String(r.cases[i].rank))).size > 1).length : 0;
  return `
    <div class="grid-head">
      <h2>Where the right answer landed</h2>
      <span class="count">${shown.length} of ${n} questions shown${multi ? `, ${diffCount} ranked differently across configurations` : ""}</span>
      <span class="filters">
        ${multi ? `<label><input type="checkbox" data-act="only-diff" ${S.onlyDiff ? "checked" : ""}> Only where they disagree</label>` : ""}
        ${tags.length ? `<select data-act="tag" aria-label="Filter by tag"><option value="">All tags</option>${tags.map((t) => `<option ${S.tag === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>` : ""}
        <input type="search" data-act="search" placeholder="Find a question" value="${esc(S.search)}" aria-label="Find a question">
      </span>
    </div>
    <p class="legend">
      <span>${ladder(1, 5)} rank 1</span><span>${ladder(3, 5)} rank 3</span><span>${ladder(null, 5)} not in the top ${maxK}</span>
      <span>Select a question to see what each configuration returned.</span>
    </p>
    <div class="rank-grid" role="list">${header}${body}</div>`;
}

const RANK_COLORS = ["var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)", "var(--r5)"];
function ladder(rank, slots) {
  const on = rank && rank <= slots ? rank : null;
  const col = rank ? RANK_COLORS[Math.min(rank, 5) - 1] : "";
  return `<span class="ladder ${rank ? "" : "miss"}" style="--c:${col}" aria-hidden="true">${Array.from({ length: slots }, (_, i) => `<i class="${on === i + 1 ? "on" : ""}"></i>`).join("")}</span>`;
}
function cell(rank, maxK) {
  const label = rank ? `rank ${rank}` : `not in the top ${maxK}`;
  return `<span class="rg-cell" aria-label="${label}">${ladder(rank, 5)}<span class="rank-n ${rank ? "" : "miss"}">${rank ? rank : "miss"}</span></span>`;
}

function detail(run, i) {
  const c0 = run.reports[0].cases[i];
  const relevant = c0.relevant || [];
  const names = Object.assign({}, ...run.reports.map((r) => r.cases[i].labels || {}));
  const idLabel = (id) => `<span class="num">${esc(id)}</span>${names[String(id)] ? ` <span class="t">${esc(names[String(id)])}</span>` : ""}`;
  return `<div class="detail">
    <div class="q">${esc(c0.q)}</div>
    <div class="want">Correct answer${relevant.length === 1 ? "" : "s"}: ${relevant.map(idLabel).join(", ") || "not recorded in this run"}</div>
    <div class="detail-cols">${run.reports.map((r) => {
      const c = r.cases[i];
      const ranked = c.ranked || [];
      return `<div><h3>${esc(r.name)}<span class="num">${ms(c.latency_ms)} ms</span></h3>
        ${ranked.length ? `<ol>${ranked.map((id) => `<li class="${relevant.some((x) => sameId(x, id)) ? "hit" : ""}">${idLabel(id)}</li>`).join("")}</ol>` : `<p class="none">Returned nothing.</p>`}
      </div>`;
    }).join("")}</div>
  </div>`;
}

function casesEditor() {
  const rows = S.casesDraft || S.state.cases.map((c) => ({ q: c.q, ids: c.relevant.join(", "), tags: (c.tags || []).join(", ") }));
  S.casesDraft = rows;
  return `<div class="editor-head">
      <h2>Labeled questions</h2>
      <span class="editor-actions"><span class="dirty" id="cases-dirty"></span>
        <button class="btn" data-act="add-case">Add question</button>
        <button class="btn primary" data-act="save-cases">Save questions</button></span>
    </div>
    <p class="editor-head hint">One row per question someone might ask. The correct ids are the items that genuinely answer it: check them against your corpus, don't guess. Separate several ids with commas.</p>
    ${S.state.cases_error ? `<p class="error" role="alert">The file couldn't be read: ${esc(S.state.cases_error)}. Saving here rewrites it.</p>` : ""}
    <table class="edit"><thead><tr><th></th><th>Question</th><th>Correct ids</th><th>Tags</th><th></th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr>
      <td class="idx">${i + 1}</td>
      <td><input data-case="${i}" data-k="q" value="${esc(r.q)}" placeholder="What would someone ask?" aria-label="Question ${i + 1}"></td>
      <td class="ids"><input data-case="${i}" data-k="ids" value="${esc(r.ids)}" placeholder="42, 57" aria-label="Correct ids for question ${i + 1}"></td>
      <td><input data-case="${i}" data-k="tags" value="${esc(r.tags)}" placeholder="title, paraphrase" aria-label="Tags for question ${i + 1}"></td>
      <td class="del"><button class="btn quiet" data-del-case="${i}" aria-label="Remove question ${i + 1}">Remove</button></td>
    </tr>`).join("")}</tbody></table>
    ${S.error ? `<p class="error" role="alert">${esc(S.error)}</p>` : ""}
    <p class="help">Saved to <code>${esc(S.state.cases_path)}</code> as JSONL. Comment lines in the file are not kept when you save from here.</p>`;
}

function targetsEditor() {
  const rows = S.targetsDraft || S.state.targets.map((t) => ({ ...t }));
  S.targetsDraft = rows;
  return `<div class="editor-head">
      <h2>Targets</h2>
      <span class="editor-actions"><span class="dirty" id="targets-dirty"></span>
        <button class="btn" data-act="add-target">Add target</button>
        <button class="btn primary" data-act="save-targets">Save targets</button></span>
    </div>
    <table class="edit"><thead><tr><th>Name</th><th>Where it lives</th><th></th></tr></thead>
    <tbody>${rows.map((t, i) => `<tr>
      <td><input data-target="${i}" data-k="name" value="${esc(t.name)}" placeholder="semantic" aria-label="Target ${i + 1} name"></td>
      <td class="spec"><input data-target="${i}" data-k="spec" value="${esc(t.spec)}" placeholder="http://localhost:8000/retrieve or mypkg.search:semantic" aria-label="Target ${i + 1} location"></td>
      <td class="del"><button class="btn quiet" data-del-target="${i}" aria-label="Remove target ${i + 1}">Remove</button></td>
    </tr>`).join("")}</tbody></table>
    ${S.error ? `<p class="error" role="alert">${esc(S.error)}</p>` : ""}
    <div class="help">
      <p>A target is one retriever configuration you want to compare. Two kinds work:</p>
      <p><b>An HTTP endpoint.</b> It receives <code>POST {"query": "..."}</code> and returns a JSON list of ids, or <code>{"ids": [...]}</code>.</p>
      <p><b>A Python function</b>, written <code>package.module:function</code>. It takes the question as a string and returns ranked ids. It can be async. Modules are imported from the folder you started <code>retrieval-eval ui</code> in.</p>
    </div>`;
}

function render() {
  renderBar();
  renderRail();
  renderMain();
}

// ---------------------------------------------------------------- actions
async function refresh() {
  S.state = await api("GET", "/api/state");
  const b = S.state.baseline;
  S.baselineRun = b ? (S.run && S.run.id === b.run ? S.run : await api("GET", `/api/runs/${encodeURIComponent(b.run)}`).catch(() => null)) : null;
}

async function openRun(id) {
  S.run = await api("GET", `/api/runs/${encodeURIComponent(id)}`);
  S.open = null;
  S.tab = "results";
  S.composing = false;
  render();
}

async function doRun() {
  const picked = [...document.querySelectorAll('input[name="pick"]:checked')].map((x) => x.value);
  S.pick = picked;
  const targets = S.state.targets.filter((t) => picked.includes(t.name));
  const ks = ($("#run-ks").value.match(/\d+/g) || []).map(Number);
  const label = $("#run-label").value.trim();
  S.runLabel = label;
  S.running = true; S.error = ""; render();
  try {
    const run = await api("POST", "/api/run", { targets, ks, label });
    await refresh();
    S.running = false;
    S.runLabel = "";
    await openRun(run.id);
  } catch (e) {
    S.running = false; S.error = e.message; render();
  }
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button, a");
  if (!t) return;
  try {
    if (t.dataset.run) return openRun(t.dataset.run);
    if (t.dataset.tab) { S.tab = t.dataset.tab; S.error = ""; return render(); }
    if (t.dataset.q !== undefined) { const i = Number(t.dataset.q); S.open = S.open === i ? null : i; return render(); }
    if (t.dataset.base) {
      await api("POST", "/api/baseline", { run: S.run.id, config: t.dataset.base });
      await refresh(); return render();
    }
    if (t.dataset.delCase !== undefined) { S.casesDraft.splice(Number(t.dataset.delCase), 1); render(); return markDirty("cases"); }
    if (t.dataset.delTarget !== undefined) { S.targetsDraft.splice(Number(t.dataset.delTarget), 1); render(); return markDirty("targets"); }
    switch (t.dataset.act) {
      case "compose": S.composing = true; S.tab = "results"; S.error = ""; return render();
      case "cancel-compose": S.composing = false; S.error = ""; return render();
      case "run": return doRun();
      case "delete":
        if (!confirm("Delete this run? Its results can't be recovered.")) return;
        await api("DELETE", `/api/runs/${encodeURIComponent(S.run.id)}`);
        S.run = null; await refresh();
        if (S.state.runs.length) return openRun(S.state.runs[0].id);
        return render();
      case "add-case":
        S.casesDraft.push({ q: "", ids: "", tags: "" }); render();
        $(`input[data-case="${S.casesDraft.length - 1}"][data-k="q"]`).focus(); return markDirty("cases");
      case "save-cases": {
        const cases = S.casesDraft
          .filter((r) => r.q.trim() || r.ids.trim())
          .map((r) => ({
            q: r.q.trim(),
            relevant: r.ids.split(",").map((s) => s.trim()).filter(Boolean).map(parseId),
            tags: r.tags.split(",").map((s) => s.trim()).filter(Boolean),
          }));
        S.state = await api("PUT", "/api/cases", { cases });
        S.casesDraft = null; S.error = ""; render();
        const d = $("#cases-dirty"); if (d) d.textContent = `Saved ${cases.length} questions`;
        return;
      }
      case "add-target":
        S.targetsDraft.push({ name: "", spec: "" }); render();
        $(`input[data-target="${S.targetsDraft.length - 1}"][data-k="name"]`).focus(); return markDirty("targets");
      case "save-targets":
        S.state = await api("PUT", "/api/targets", { targets: S.targetsDraft.filter((x) => x.name.trim() && x.spec.trim()).map((x) => ({ name: x.name.trim(), spec: x.spec.trim() })) });
        S.targetsDraft = null; S.pick = null; S.error = ""; render();
        { const d = $("#targets-dirty"); if (d) d.textContent = "Saved"; }
        return;
    }
  } catch (e) {
    S.error = e.message; render();
  }
});

function markDirty(kind) {
  const d = $(`#${kind}-dirty`);
  if (d) d.textContent = "Unsaved changes";
}

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.case !== undefined) { S.casesDraft[Number(el.dataset.case)][el.dataset.k] = el.value; return markDirty("cases"); }
  if (el.dataset.target !== undefined) { S.targetsDraft[Number(el.dataset.target)][el.dataset.k] = el.value; return markDirty("targets"); }
  if (el.dataset.act === "search") {
    S.search = el.value; S.open = null;
    const pos = el.selectionStart;
    renderMain();
    const again = $('input[data-act="search"]'); again.focus(); again.setSelectionRange(pos, pos);
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.act === "only-diff") { S.onlyDiff = el.checked; S.open = null; renderMain(); }
  if (el.dataset.act === "tag") { S.tag = el.value; S.open = null; renderMain(); }
  if (el.name === "pick") { S.pick = [...document.querySelectorAll('input[name="pick"]:checked')].map((x) => x.value); }
});

// ---------------------------------------------------------------- boot
(async function boot() {
  if (STATIC) { S.onlyDiff = STATIC.run.reports.length > 1; return render(); }
  try {
    await refresh();
    if (S.state.runs.length) await openRun(S.state.runs[0].id);
    else render();
  } catch (e) {
    $("#main").innerHTML = `<p class="error" role="alert">Couldn't reach the retrieval-eval server: ${esc(e.message)}. Is <code>retrieval-eval ui</code> still running?</p>`;
  }
})();
</script>
</body>
</html>
